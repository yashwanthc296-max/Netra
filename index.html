<!DOCTYPE html>
<html lang="en">
<head>

    <title>NETRA ROVER MONITERING SYSTEM</title>
    <link rel="stylesheet" type="text/css" href="/style.css">
</head>
<body>
    <!-- project-brand -->
    <header class="topbar">

        <div class="brand">
            <div class="brand-logo">N</div>
        <div>
        <h1>NETRA</h1>
        <p>Robot Mission Control</p>
        </div>
        </div>
        <!-- This is for navigation Section -->
